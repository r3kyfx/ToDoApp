<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./phone.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="ui">
        <div class="header">
          <h1>TODO</h1>
          <div id="themeBtn"></div>
        </div>
        <div class="app">
          <input
            type="text"
            placeholder="Create a new todo..."
            id="userInput"
          />
          <div class="task-list"></div>
          <div class="footer">
            <span id="counter">0 items left</span>
            <div class="filters">
              <button id="all">All</button>
              <button id="active">Active</button>
              <button id="completed">Completed</button>
            </div>
            <button id="clearCompleted">Clear Completed</button>
          </div>
          <div class="phone-footer">
            <span id="phone-counter">0 items left</span>
            <button id="phone-clearCompleted">Clear Completed</button>
          </div>
          <div class="phone-filters">
            <button id="phone-all">All</button>
            <button id="phone-active">Active</button>
            <button id="phone-completed">Completed</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
